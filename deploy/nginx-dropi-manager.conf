# Copy to /etc/nginx/sites-available/dropi-manager and symlink into sites-enabled.
# Replace YOUR_DOMAIN_OR_IP with your domain or the VM's external IP.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # A single Excel/CSV upload can legitimately be several MB — nginx's own
    # default (1MB) would reject those before they ever reach the backend's
    # own MAX_UPLOAD_BYTES check.
    client_max_body_size 25m;

    # Baseline browser-side protections. The frontend is a React SPA with no
    # third-party embeds, so a strict default-src is safe here.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    root __HOME__/dropi-manager/frontend/dist;
    index index.html;

    # React Router: any unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
